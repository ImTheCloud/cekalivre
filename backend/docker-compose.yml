# Déploiement complet sur un serveur (voir docs/DEPLOIEMENT.md) :
#   1. ./scripts/prepare-osrm.sh          (une seule fois, puis à chaque mise à jour de la carte)
#   2. cp .env.example .env && nano .env  (API_TOKEN, DOMAIN)
#   3. docker compose up -d --build
services:
  api:
    build: .
    env_file:
      - path: .env
        required: false
    environment:
      OSRM_URL: http://osrm:5000
      OSRM_MAX_TABLE_SIZE: "1000"
      GEOCODE_CACHE_PATH: /data/geocode-cache.sqlite3
    volumes:
      - geocode-cache:/data
    ports:
      # Sur un serveur avec Caddy (HTTPS), mets API_BIND=127.0.0.1 dans .env pour ne pas exposer le port 8000.
      - "${API_BIND:-0.0.0.0}:8000:8000"
    depends_on:
      - osrm
    restart: unless-stopped

  osrm:
    image: ghcr.io/project-osrm/osrm-backend:v6.0.0
    command: osrm-routed --algorithm mld --max-table-size 1000 /data/region.osrm
    volumes:
      - ./osrm-data:/data
    restart: unless-stopped

  # HTTPS automatique (Let's Encrypt) : obligatoire pour une build de l'app installée sur le téléphone.
  # Activé avec : docker compose --profile https up -d
  caddy:
    image: caddy:2
    profiles: ["https"]
    env_file:
      - path: .env
        required: false
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    depends_on:
      - api
    restart: unless-stopped

volumes:
  geocode-cache:
  caddy-data:
